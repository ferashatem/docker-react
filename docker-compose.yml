version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app               # ← المهم دي موجودة
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true   # ← ضيف السطر ده كمان
    
  frontend-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run test
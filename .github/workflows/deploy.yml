name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build test image
        run: docker build -t docker-react:test -f Dockerfile.dev .

      - name: Run tests
        run: docker run -e CI=true docker-react:test npm test -- --watchAll=false

      - name: Build production image
        run: docker build -t ferashatem/docker-react:latest .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push to Docker Hub
        run: docker push ferashatem/docker-react:latest